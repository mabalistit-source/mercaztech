<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סוף שבוע בקיסריה - רוטשילד מול הים</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --sea: #0e7490;
        --sea-dark: #0c4a6e;
        --sand: #f4dfb8;
        --sand-dark: #d9a441;
        --sunset: #f97316;
        --ink: #1e293b;
        --card: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
        font-family: 'Assistant', sans-serif;
        background: linear-gradient(180deg, #e0f2fe 0%, #f8fafc 18%, #f8fafc 100%);
        color: var(--ink);
        min-height: 100vh;
        padding-bottom: 4rem;
    }
    a { color: inherit; }

    /* Header */
    header.hero {
        position: relative;
        background: linear-gradient(135deg, var(--sea-dark), var(--sea) 55%, #14b8a6);
        color: #fff;
        padding: 2.4rem 1.2rem 3.2rem;
        text-align: center;
        overflow: hidden;
    }
    header.hero::after {
        content: "";
        position: absolute;
        bottom: -1px; left: 0; right: 0;
        height: 40px;
        background: radial-gradient(circle at 50% 0%, transparent 0, transparent 100%);
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 40' preserveAspectRatio='none'><path d='M0,20 C150,40 350,0 600,20 C850,40 1050,0 1200,20 L1200,40 L0,40 Z'/></svg>") bottom / 100% 100% no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 40' preserveAspectRatio='none'><path d='M0,20 C150,40 350,0 600,20 C850,40 1050,0 1200,20 L1200,40 L0,40 Z'/></svg>") bottom / 100% 100% no-repeat;
        background-color: #f8fafc;
    }
    .badge {
        display: inline-block;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.4);
        backdrop-filter: blur(6px);
        padding: 0.4rem 1.1rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 0.9rem;
    }
    h1.title {
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        font-weight: 800;
        margin: 0 0 0.5rem;
        text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .subtitle { font-size: 1.05rem; opacity: 0.95; margin: 0; }

    .apt-card {
        max-width: 760px;
        margin: -2.2rem auto 1.6rem;
        background: var(--card);
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(14,116,144,0.18);
        padding: 1.2rem 1.4rem;
        position: relative;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: center;
        justify-content: space-between;
    }
    .apt-card .apt-info { display: flex; align-items: center; gap: 0.8rem; }
    .apt-card .apt-icon {
        width: 46px; height: 46px; border-radius: 14px;
        background: linear-gradient(135deg, #fde68a, #f59e0b);
        display: flex; align-items: center; justify-content: center;
        font-size: 1.4rem; flex-shrink: 0;
    }
    .apt-card .apt-text { text-align: right; }
    .apt-card .apt-text .label { font-size: 0.75rem; color: #64748b; display: block; }
    .apt-card .apt-text .value { font-weight: 700; color: var(--sea-dark); font-size: 1rem; }
    .apt-card .map-btn {
        background: var(--sea-dark);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        white-space: nowrap;
        transition: transform 0.15s ease, background 0.2s ease;
        display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .apt-card .map-btn:hover { background: var(--sea); transform: translateY(-1px); }

    /* Countdown */
    #countdown-wrap {
        max-width: 760px;
        margin: 0 auto 1.8rem;
        text-align: center;
        padding: 0 1.2rem;
    }
    #countdown {
        display: inline-flex;
        gap: 0.6rem;
        background: var(--card);
        border-radius: 18px;
        padding: 0.8rem 1.2rem;
        box-shadow: 0 8px 20px rgba(15,23,42,0.06);
        flex-wrap: wrap;
        justify-content: center;
    }
    .cd-unit { text-align: center; min-width: 56px; }
    .cd-unit .num { font-size: 1.4rem; font-weight: 800; color: var(--sunset); display: block; line-height: 1.1; }
    .cd-unit .lbl { font-size: 0.7rem; color: #64748b; }
    #countdown-label { font-size: 0.85rem; color: #475569; margin-top: 0.5rem; font-weight: 600; }

    /* Progress */
    .progress-wrap {
        max-width: 760px;
        margin: 0 auto 1rem;
        padding: 0 1.2rem;
    }
    .progress-track {
        background: #e2e8f0;
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #14b8a6, #0e7490);
        border-radius: 999px;
        transition: width 0.35s ease;
        width: 0%;
    }
    .progress-text { font-size: 0.8rem; color: #64748b; margin-top: 0.4rem; text-align: center; }

    /* Tabs */
    .tabs {
        max-width: 760px;
        margin: 0 auto 1.4rem;
        display: flex;
        gap: 0.6rem;
        padding: 0 1.2rem;
    }
    .tab-btn {
        flex: 1;
        border: none;
        background: #fff;
        color: var(--sea-dark);
        font-family: inherit;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 0.85rem 0.6rem;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(15,23,42,0.06);
        border: 2px solid transparent;
        transition: all 0.2s ease;
        text-align: center;
        line-height: 1.35;
    }
    .tab-btn .day-date { display: block; font-size: 0.75rem; font-weight: 500; opacity: 0.75; }
    .tab-btn.active {
        background: linear-gradient(135deg, var(--sea-dark), var(--sea));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 10px 24px rgba(14,116,144,0.3);
        transform: translateY(-2px);
    }

    /* Timeline */
    main { max-width: 760px; margin: 0 auto; padding: 0 1.2rem; }
    .day-panel { display: none; }
    .day-panel.active { display: block; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

    .timeline { position: relative; padding-right: 2.2rem; }
    .timeline::before {
        content: "";
        position: absolute;
        right: 0.85rem;
        top: 0.4rem;
        bottom: 0.4rem;
        width: 3px;
        background: linear-gradient(180deg, var(--sea), var(--sand-dark));
        border-radius: 999px;
    }
    .item {
        position: relative;
        background: var(--card);
        border-radius: 18px;
        padding: 1rem 1.1rem;
        margin-bottom: 1rem;
        box-shadow: 0 6px 18px rgba(15,23,42,0.06);
        border: 2px solid transparent;
        transition: border-color 0.2s ease, opacity 0.2s ease;
    }
    .item.done { opacity: 0.55; border-color: #14b8a6; }
    .item::before {
        content: attr(data-emoji);
        position: absolute;
        right: -2.2rem;
        top: 0.9rem;
        width: 2.1rem; height: 2.1rem;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--sea);
        display: flex; align-items: center; justify-content: center;
        font-size: 1rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .item.done::before { border-color: #14b8a6; background: #ecfdf5; }
    .item-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.6rem;
        cursor: pointer;
    }
    .item-time {
        display: inline-block;
        background: #fef3c7;
        color: #92400e;
        font-weight: 800;
        font-size: 0.8rem;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        margin-bottom: 0.35rem;
    }
    .item-title { font-weight: 800; font-size: 1.05rem; color: var(--sea-dark); margin: 0; }
    .check-btn {
        flex-shrink: 0;
        width: 30px; height: 30px;
        border-radius: 50%;
        border: 2px solid #cbd5e1;
        background: #fff;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: transparent;
        font-weight: 900;
        transition: all 0.2s ease;
    }
    .item.done .check-btn { background: #14b8a6; border-color: #14b8a6; color: #fff; }
    .item-body { display: none; padding-top: 0.6rem; }
    .item-body.open { display: block; animation: fadeIn 0.25s ease; }
    .item-desc { font-size: 0.92rem; color: #475569; line-height: 1.6; margin: 0 0 0.7rem; }
    .item-desc b { color: var(--ink); }
    .item-links { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .link-btn {
        display: inline-flex; align-items: center; gap: 0.35rem;
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 700;
        padding: 0.45rem 0.85rem;
        border-radius: 999px;
        transition: transform 0.15s ease;
    }
    .link-btn:hover { transform: translateY(-1px); }
    .link-map { background: #e0f2fe; color: var(--sea-dark); }
    .link-site { background: #fef3c7; color: #92400e; }
    .link-phone { background: #dcfce7; color: #166534; }
    .link-tickets { background: #ede9fe; color: #5b21b6; }
    .link-reserved { background: #dcfce7; color: #166534; }
    .reserved-badge {
        background: #dcfce7 !important;
        color: #166534 !important;
        margin-right: 0.4rem;
    }
    .item-reservation {
        font-size: 0.85rem;
        color: #166534;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 10px;
        padding: 0.6rem 0.8rem;
        margin-bottom: 0.6rem;
        line-height: 1.6;
    }
    .item-hours {
        font-size: 0.82rem;
        color: var(--sea-dark);
        background: #ecfeff;
        border-radius: 8px;
        padding: 0.4rem 0.7rem;
        margin-bottom: 0.6rem;
        font-weight: 600;
    }
    .item-note {
        margin-top: 0.6rem;
        font-size: 0.8rem;
        background: #fff7ed;
        border-right: 3px solid var(--sunset);
        padding: 0.5rem 0.7rem;
        border-radius: 8px;
        color: #9a3412;
    }

    footer.finale {
        max-width: 760px;
        margin: 2rem auto 0;
        padding: 1.6rem 1.4rem;
        text-align: center;
        background: linear-gradient(135deg, #fde68a, #fca5a5, #f97316);
        border-radius: 22px;
        color: #7c2d12;
        font-weight: 800;
        font-size: 1.1rem;
        box-shadow: 0 10px 30px rgba(249,115,22,0.25);
    }

    #print-btn {
        position: fixed;
        left: 1rem; bottom: 1rem;
        z-index: 50;
        background: var(--sea-dark);
        color: #fff;
        border: none;
        font-family: inherit;
        font-weight: 700;
        font-size: 0.85rem;
        padding: 0.7rem 1.1rem;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(15,23,42,0.25);
    }

    @media print {
        #print-btn, #countdown-wrap, .tabs { display: none !important; }
        .day-panel { display: block !important; }
        body { background: #fff; }
    }
    @media (max-width: 480px) {
        .apt-card { flex-direction: column; align-items: stretch; text-align: center; }
        .apt-card .apt-info { justify-content: center; }
        .apt-card .apt-text { text-align: center; }
        .apt-card .map-btn { justify-content: center; }
    }
</style>
</head>
<body>

<header class="hero">
    <span class="badge">🏖️ 4–5 בספטמבר 2026 · שישי–שבת</span>
    <h1 class="title">סוף שבוע בקיסריה</h1>
    <p class="subtitle">הדירה שלנו · רחוב רוטשילד · מול הים</p>
</header>

<div class="apt-card">
    <div class="apt-info">
        <div class="apt-icon">🏠</div>
        <div class="apt-text">
            <span class="label">נקודת המוצא</span>
            <span class="value">הדירה ברח' רוטשילד, מתחם "נאות גולף", קיסריה</span>
        </div>
    </div>
    <a class="map-btn" target="_blank" rel="noopener"
       href="https://maps.google.com/?q=%D7%A8%D7%97%D7%95%D7%91+%D7%A8%D7%95%D7%98%D7%A9%D7%99%D7%9C%D7%93+%D7%A7%D7%99%D7%A1%D7%A8%D7%99%D7%94">
        🧭 ניווט לדירה
    </a>
</div>

<div id="countdown-wrap">
    <div id="countdown">
        <div class="cd-unit"><span class="num" id="cd-days">--</span><span class="lbl">ימים</span></div>
        <div class="cd-unit"><span class="num" id="cd-hours">--</span><span class="lbl">שעות</span></div>
        <div class="cd-unit"><span class="num" id="cd-mins">--</span><span class="lbl">דקות</span></div>
        <div class="cd-unit"><span class="num" id="cd-secs">--</span><span class="lbl">שניות</span></div>
    </div>
    <div id="countdown-label"></div>
</div>

<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text">0 מתוך 0 תחנות סומנו כ"בוצע"</div>
</div>

<div class="tabs">
    <button class="tab-btn active" data-day="fri">יום שישי<span class="day-date">4.9 · פתיחה, ים ושקיעה</span></button>
    <button class="tab-btn" data-day="sat">שבת<span class="day-date">5.9 · בוקר, תרבות וצהריים</span></button>
</div>

<main>
    <div class="day-panel active" id="panel-fri">
        <div class="timeline" id="timeline-fri"></div>
    </div>
    <div class="day-panel" id="panel-sat">
        <div class="timeline" id="timeline-sat"></div>
    </div>
</main>

<footer class="finale">
    🌊 תבלו המון ותיהנו מהחופשה! 🌅
</footer>

<button id="print-btn" onclick="window.print()">🖨️ הדפסה / PDF</button>

<script>
const mapsUrl = (q) => "https://maps.google.com/?q=" + encodeURIComponent(q);
const searchUrl = (q) => "https://www.google.com/search?q=" + encodeURIComponent(q);

const itinerary = {
    fri: [
        {
            time: "14:00",
            emoji: "🧳",
            title: "הגעה והתארגנות בדירה",
            desc: "הגעה לדירה במתחם <b>\"נאות גולף\"</b> (מרחבים ירוקים ואווירה שקטה). זמן לפרוק מזוודות, לשתות קפה רגוע ולהתחיל את החופשה בראש שקט.",
            map: "רחוב רוטשילד, נאות גולף, קיסריה"
        },
        {
            time: "15:30",
            emoji: "☕",
            title: "קפה של אחר צהריים מול הים בנמל קיסריה",
            desc: "סיור ראשוני בנמל העתיק – שילוב של אבנים עתיקות, גלריות ובתי קפה על המים.",
            map: "נמל קיסריה העתיקה",
            hours: "הגן הלאומי/הנמל: 08:00–18:00 (שעון קיץ)",
            tickets: "https://www.parks.org.il/reserve-park/%D7%92%D7%9F-%D7%9C%D7%90%D7%95%D7%9E%D7%99-%D7%A7%D7%99%D7%A1%D7%A8%D7%99%D7%94/",
            note: "כניסה לנמל למבקרים הבאים לשבת בבית קפה/מסעדה: 18 ₪ לאדם (לתושבי קיסריה ואור עקיבא – חינם). בשעות הערב הכניסה לנמל חופשית."
        },
        {
            time: "17:30",
            emoji: "🌅",
            title: "סיור שקיעה בחוף האקוודוקט",
            desc: "קפיצה לחוף הים המפורסם לצד הקשתות הרומיות העתיקות – מושלם להליכה רגלית מול שקיעה של סוף קיץ ותמונות משותפות.",
            map: "חוף האקוודוקט קיסריה",
            hours: "כניסה חופשית לחוף, פתוח כל היום ללא שעות נעילה"
        },
        {
            time: "20:00",
            emoji: "🍽️",
            title: "ארוחת ערב חגיגית – מסעדת \"הלנה\" (Hellena)",
            desc: "מסעדת שף מוקפדת על קו המים, תפריט ישראלי עכשווי עם דגה טרייה ובשרים מיושנים.",
            map: "מסעדת הלנה Hellena קיסריה",
            site: "https://www.hellena.co.il/",
            phone: "04-6101018",
            hours: "כל ימות השבוע (כולל שישי): 12:00–23:00",
            reservation: {
                summary: "ההזמנה אושרה על שם שרי חזי: יום שישי, 4.9, 20:00–22:15, ל-3 סועדים באיזור פנים.",
                details: "הכניסה לגן הלאומי מותנית בתשלום 18 ₪ לאורח לרשות הטבע והגנים, עד השעה 17:00. אין התחייבות להושבה בשולחן ספציפי.",
                link: "https://tbit.be/jqIHbO"
            },
            note: "לתשומת לב: המסעדה אינה כשרה."
        }
    ],
    sat: [
        {
            time: "09:30",
            emoji: "🥐",
            title: "ארוחת בוקר מפנקת – קפה בגולף, מועדון הגולף קיסריה",
            desc: "בית קפה נעים בתוך מועדון הגולף (שד' רוטשילד 1 – ממש קרוב לדירה), עם נוף ירוק ומרגיע למגרשי הגולף. תפריט ארוחות בוקר ובראנץ' מפנק, קפה איכותי ומיצים סחוטים.",
            map: "קפה בגולף מועדון הגולף קיסריה",
            site: "https://www.cafebagolf.co.il/",
            phone: "053-9376353",
            hours: "שבת: 08:00–16:00",
            note: "כשר-סטייל, ללא תעודת כשרות. מומלץ להזמין מקום מראש (דרך טאביט)."
        },
        {
            time: "12:00",
            emoji: "🐴",
            title: "רכיבה על סוסים – חוות היער, יער חדרה",
            desc: "טיול רכיבה נעים בלב הטבע מול יער חדרה. חווה משפחתית עם סוסים מאולפים ורגועים (מתאימים גם לילדים קטנים), פינת חי עם בעלי חיים נוספים, וטיולי רכיבה/כרכרות בשטח פסטורלי.",
            map: "חוות היער יער חדרה",
            phone: "054-5260420",
            info: "חוות היער יער חדרה רכיבה על סוסים",
            note: "מומלץ להתקשר מראש לתיאום מועד, מחיר ומשך הפעילות."
        }
    ]
};

function buildTimeline(dayKey) {
    const container = document.getElementById("timeline-" + dayKey);
    itinerary[dayKey].forEach((it, idx) => {
        const id = dayKey + "-" + idx;
        const el = document.createElement("div");
        el.className = "item";
        el.dataset.id = id;
        el.dataset.emoji = it.emoji;

        const links = [
            `<a class="link-btn link-map" target="_blank" rel="noopener" href="${mapsUrl(it.map)}">🧭 ניווט</a>`
        ];
        if (it.site) {
            const siteHref = /^https?:\/\//.test(it.site) ? it.site : searchUrl(it.site);
            links.push(`<a class="link-btn link-site" target="_blank" rel="noopener" href="${siteHref}">🔗 אתר ותפריט</a>`);
        }
        if (it.phone) {
            links.push(`<a class="link-btn link-phone" href="tel:${it.phone.replace(/-/g, "")}">📞 ${it.phone}</a>`);
        }
        if (it.tickets) {
            links.push(`<a class="link-btn link-tickets" target="_blank" rel="noopener" href="${it.tickets}">🎫 רכישת כרטיסים</a>`);
        }
        if (it.info) {
            links.push(`<a class="link-btn link-site" target="_blank" rel="noopener" href="${searchUrl(it.info)}">🔎 מידע נוסף</a>`);
        }
        if (it.reservation && it.reservation.link) {
            links.push(`<a class="link-btn link-reserved" target="_blank" rel="noopener" href="${it.reservation.link}">📋 פרטי ההזמנה</a>`);
        }

        el.innerHTML = `
            <div class="item-head" onclick="toggleItem('${id}')">
                <div>
                    <span class="item-time">🕒 ${it.time}</span>
                    ${it.reservation ? `<span class="item-time reserved-badge">✅ הוזמן</span>` : ""}
                    <p class="item-title">${it.title}</p>
                </div>
                <button class="check-btn" onclick="event.stopPropagation(); toggleDone('${id}')">✓</button>
            </div>
            <div class="item-body" id="body-${id}">
                <p class="item-desc">${it.desc}</p>
                ${it.hours ? `<div class="item-hours">🕐 שעות פעילות: ${it.hours}</div>` : ""}
                ${it.reservation ? `<div class="item-reservation">✅ <b>${it.reservation.summary}</b><br>${it.reservation.details}</div>` : ""}
                <div class="item-links">${links.join("")}</div>
                ${it.note ? `<div class="item-note">📌 ${it.note}</div>` : ""}
            </div>
        `;
        container.appendChild(el);
    });
}

buildTimeline("fri");
buildTimeline("sat");

const STORAGE_KEY = "caesarea-weekend-done";
function getDoneSet() {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
    catch (e) { return new Set(); }
}
function saveDoneSet(set) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch (e) {}
}

function toggleItem(id) {
    const body = document.getElementById("body-" + id);
    body.classList.toggle("open");
}

function toggleDone(id) {
    const done = getDoneSet();
    const el = document.querySelector(`.item[data-id="${id}"]`);
    if (done.has(id)) { done.delete(id); el.classList.remove("done"); }
    else { done.add(id); el.classList.add("done"); }
    saveDoneSet(done);
    updateProgress();
}

function updateProgress() {
    const done = getDoneSet();
    const total = itinerary.fri.length + itinerary.sat.length;
    const doneCount = [...done].length;
    document.getElementById("progress-fill").style.width = (total ? (doneCount / total * 100) : 0) + "%";
    document.getElementById("progress-text").textContent = `${doneCount} מתוך ${total} תחנות סומנו כ"בוצע"`;
}

(function restoreDone() {
    const done = getDoneSet();
    done.forEach(id => {
        const el = document.querySelector(`.item[data-id="${id}"]`);
        if (el) el.classList.add("done");
    });
    updateProgress();
})();

document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".day-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.day).classList.add("active");
    });
});

// Countdown to Friday 4.9.2026 14:00 (Israel time, UTC+3 in September)
const tripStart = new Date("2026-09-04T14:00:00+03:00");
function updateCountdown() {
    const now = new Date();
    let diff = tripStart - now;
    const label = document.getElementById("countdown-label");
    if (diff <= 0) {
        document.getElementById("cd-days").textContent = "0";
        document.getElementById("cd-hours").textContent = "0";
        document.getElementById("cd-mins").textContent = "0";
        document.getElementById("cd-secs").textContent = "0";
        label.textContent = "🎉 סוף השבוע בקיסריה כבר כאן!";
        return;
    }
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);
    document.getElementById("cd-days").textContent = d;
    document.getElementById("cd-hours").textContent = h;
    document.getElementById("cd-mins").textContent = m;
    document.getElementById("cd-secs").textContent = s;
    label.textContent = "⏳ עד ההגעה לדירה בקיסריה";
}
updateCountdown();
setInterval(updateCountdown, 1000);

// Auto-select the relevant day tab if viewing during the trip
(function autoSelectDay() {
    const now = new Date();
    const satStart = new Date("2026-09-05T00:00:00+03:00");
    if (now >= satStart) {
        document.querySelector('.tab-btn[data-day="sat"]').click();
    }
})();
</script>
