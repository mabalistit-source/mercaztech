<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ציר הזמן של אשדוד</title>
<style>
  :root {
    --sand: #f4e9d8;
    --sea: #1b6e8c;
    --sea-dark: #0f4a5f;
    --sun: #e8974a;
    --ink: #2c2416;
    --green: #3f8f5c;
    --red: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #dff1f7 0%, var(--sand) 40%);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: var(--sea-dark);
    margin: 6px 0 2px;
    font-size: 1.7em;
  }
  .subtitle {
    text-align: center;
    color: #555;
    margin-bottom: 18px;
    font-size: 0.95em;
  }
  .basket {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    background: repeating-linear-gradient(135deg, #efd9b0, #efd9b0 10px, #e7cd9c 10px, #e7cd9c 20px);
    border: 3px dashed var(--sun);
    border-radius: 16px;
    padding: 16px;
    margin: 0 auto 26px;
    max-width: 1000px;
    min-height: 150px;
  }
  .photo {
    width: 110px;
    height: 110px;
    border-radius: 10px;
    border: 3px solid #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    cursor: grab;
    background-size: cover;
    background-position: center;
    position: relative;
    touch-action: none;
  }
  .photo:active { cursor: grabbing; }
  .photo.placed { opacity: 0; pointer-events: none; }
  .letter-tag {
    position: absolute;
    bottom: 2px;
    left: 3px;
    font-size: 9px;
    color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.4);
    border-radius: 3px;
    padding: 0 3px;
    line-height: 1.3;
    user-select: none;
    pointer-events: none;
  }
  .track-wrap {
    max-width: 1150px;
    margin: 0 auto;
    overflow-x: auto;
    padding-bottom: 10px;
  }
  .track {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    min-width: 900px;
    position: relative;
    padding: 0 10px;
  }
  .track::before {
    content: "";
    position: absolute;
    top: 96px;
    left: 10px;
    right: 10px;
    height: 6px;
    background: var(--sea);
    border-radius: 3px;
    z-index: 0;
  }
  .slot-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
    min-width: 110px;
  }
  .dropzone {
    width: 110px;
    height: 110px;
    border-radius: 10px;
    border: 3px dashed #8aa8b3;
    background: rgba(255,255,255,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    background-size: cover;
    background-position: center;
    transition: border-color .15s, background-color .15s;
  }
  .dropzone.filled {
    border-style: solid;
    border-color: var(--sea);
  }
  .dropzone.dragover {
    border-color: var(--sun);
    background-color: #fff2df;
  }
  .dropzone.correct { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,143,92,0.4); }
  .dropzone.incorrect { border-color: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,0.4); }
  .year-dot {
    width: 16px;
    height: 16px;
    background: var(--sea-dark);
    border: 3px solid var(--sand);
    border-radius: 50%;
    margin: 10px 0 6px;
  }
  .year-label {
    font-weight: bold;
    color: var(--sea-dark);
    font-size: 1.05em;
    margin-bottom: 4px;
  }
  .controls {
    text-align: center;
    margin: 26px 0 10px;
  }
  button {
    background: var(--sea);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 30px;
    font-size: 1em;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    transition: background .15s, transform .1s;
  }
  button:hover { background: var(--sea-dark); transform: translateY(-1px); }
  button:disabled { background: #aaa; cursor: not-allowed; transform: none; }
  #resetBtn { background: var(--sun); margin-inline-start: 10px; }
  #resetBtn:hover { background: #c9752e; }
  .feedback {
    max-width: 600px;
    margin: 18px auto 0;
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    font-size: 1.15em;
    font-weight: bold;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.success {
    background: #e3f6e9;
    color: var(--green);
    border: 2px solid var(--green);
  }
  .feedback.fail {
    background: #fbe7e5;
    color: var(--red);
    border: 2px solid var(--red);
  }
  .progress {
    text-align: center;
    color: #555;
    margin-bottom: 4px;
    font-size: 0.9em;
  }
</style>
</head>
<body>

const shuffled = [...items].sort(() => Math.random() - 0.5);

const basket = document.getElementById('basket');
const track = document.getElementById('track');
const checkBtn = document.getElementById('checkBtn');
const resetBtn = document.getElementById('resetBtn');
const feedback = document.getElementById('feedback');
const progressEl = document.getElementById('progress');

let placement = {}; // year -> itemId

function buildBasket() {
  basket.innerHTML = '';
  shuffled.forEach(item => {
    const el = document.createElement('div');
    el.className = 'photo';
    el.style.backgroundImage = `url(${item.img})`;
    el.draggable = true;
    el.dataset.id = item.id;
    el.id = 'basket-' + item.id;
    const tag = document.createElement('span');
    tag.className = 'letter-tag';
    tag.textContent = item.letter;
    el.appendChild(tag);
    el.addEventListener('dragstart', onDragStart);
    basket.appendChild(el);
  });
}

function buildTrack() {
  track.innerHTML = '';
  items.forEach(item => {
    const col = document.createElement('div');
    col.className = 'slot-col';

    const yearLabel = document.createElement('div');
    yearLabel.className = 'year-label';
    yearLabel.textContent = item.year;
    col.appendChild(yearLabel);

    const dot = document.createElement('div');
    dot.className = 'year-dot';
    col.appendChild(dot);

    const zone = document.createElement('div');
    zone.className = 'dropzone';
    zone.dataset.year = item.year;
    zone.dataset.itemId = '';
    zone.addEventListener('dragover', onDragOver);
    zone.addEventListener('dragleave', onDragLeave);
    zone.addEventListener('drop', onDrop);
    col.appendChild(zone);

    track.appendChild(col);
  });
}

function onDragStart(e) {
  const photo = e.target.closest('.photo');
  e.dataTransfer.setData('text/plain', photo.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('dragover');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('dragover');
}

function placeItem(zone, itemId) {
  // if this zone already had an item, send it back to basket
  if (zone.dataset.itemId) {
    returnToBasket(zone.dataset.itemId);
  }
  // if the item being placed was already somewhere else, clear that zone
  document.querySelectorAll('.dropzone').forEach(z => {
    if (z.dataset.itemId === itemId) {
      z.dataset.itemId = '';
      z.classList.remove('filled', 'correct', 'incorrect');
      z.style.backgroundImage = '';
    }
  });
  for (const y in placement) {
    if (placement[y] === itemId) delete placement[y];
  }

  const item = items.find(i => i.id === itemId);
  zone.style.backgroundImage = `url(${item.img})`;
  zone.classList.add('filled');
  zone.classList.remove('correct', 'incorrect');
  zone.dataset.itemId = itemId;
  placement[zone.dataset.year] = itemId;

  const basketEl = document.getElementById('basket-' + itemId);
  if (basketEl) basketEl.classList.add('placed');

  updateProgress();
}

function onDrop(e) {
  e.preventDefault();
  const zone = e.currentTarget;
  zone.classList.remove('dragover');
  const itemId = e.dataTransfer.getData('text/plain');
  if (!itemId) return;
  placeItem(zone, itemId);
}

function returnToBasket(itemId) {
  const basketEl = document.getElementById('basket-' + itemId);
  if (basketEl) basketEl.classList.remove('placed');
}

function updateProgress() {
  const count = Object.keys(placement).length;
  progressEl.textContent = `שובצו ${count} מתוך 7 תמונות`;
  checkBtn.disabled = count < 7;
}

function checkAnswers() {
  let allCorrect = true;
  document.querySelectorAll('.dropzone').forEach(zone => {
    const year = zone.dataset.year;
    const itemId = zone.dataset.itemId;
    const correctItem = items.find(i => String(i.year) === String(year));
    zone.classList.remove('correct', 'incorrect');
    if (correctItem && correctItem.id === itemId) {
      zone.classList.add('correct');
    } else {
      zone.classList.add('incorrect');
      allCorrect = false;
    }
  });

  feedback.classList.remove('success', 'fail');
  feedback.classList.add('show');
  if (allCorrect) {
    feedback.classList.add('success');
    feedback.textContent = '\u2705 כל הכבוד! כל התמונות שובצו נכון על ציר הזמן!';
  } else {
    feedback.classList.add('fail');
    feedback.textContent = '\u274C לא כל התמונות נמצאות במקום הנכון. נסו שוב!';
  }
}

function fullReset() {
  placement = {};
  document.querySelectorAll('.dropzone').forEach(z => {
    z.classList.remove('filled', 'correct', 'incorrect', 'dragover');
    z.style.backgroundImage = '';
    z.dataset.itemId = '';
  });
  feedback.classList.remove('show', 'success', 'fail');
  buildBasket();
  updateProgress();
}

checkBtn.addEventListener('click', checkAnswers);
resetBtn.addEventListener('click', fullReset);

buildBasket();
buildTrack();
updateProgress();

// Basic touch support for mobile drag-and-drop
let dragged = null;
let dragClone = null;

document.addEventListener('touchstart', e => {
  const photo = e.target.closest('.photo');
  if (!photo || photo.classList.contains('placed')) return;
  dragged = photo;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!dragged) return;
  e.preventDefault();
  const touch = e.touches[0];
  if (!dragClone) {
    dragClone = dragged.cloneNode(true);
    dragClone.style.position = 'fixed';
    dragClone.style.zIndex = 1000;
    dragClone.style.pointerEvents = 'none';
    dragClone.style.opacity = '0.85';
    dragClone.style.width = '90px';
    dragClone.style.height = '90px';
    document.body.appendChild(dragClone);
  }
  dragClone.style.left = (touch.clientX - 45) + 'px';
  dragClone.style.top = (touch.clientY - 45) + 'px';
}, { passive: false });

document.addEventListener('touchend', e => {
  if (!dragged) return;
  const touch = e.changedTouches[0];
  if (dragClone) { dragClone.style.display = 'none'; }
  const el = document.elementFromPoint(touch.clientX, touch.clientY);
  const zone = el ? el.closest('.dropzone') : null;
  if (zone) {
    placeItem(zone, dragged.dataset.id);
  }
  if (dragClone) { dragClone.remove(); dragClone = null; }
  dragged = null;
}, { passive: true });
</script>
