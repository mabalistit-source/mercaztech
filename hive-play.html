<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>כוורת הידע — הצטרפות מהטלפון</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap');
  :root{
    --bg:#fbf8f1; --ink:#1d2433; --muted:#556070; --line:#e6dfcf; --card:#fff;
    --c-el:#8a5000; --c-ma:#16599a; --c-bi:#386a12;
    --b-blue:#3090d8; --b-green:#78a830; --b-amber:#f0a818; --b-red:#d84830; --danger:#b3261e;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Assistant','Segoe UI',Arial,sans-serif;line-height:1.45;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  h1,h2,h3{font-family:'Rubik','Assistant',sans-serif;margin:0;}
  button,input{font-family:inherit;font-size:1rem;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--b-blue);outline-offset:2px;}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;box-shadow:0 2px 10px rgba(29,36,51,.06);position:sticky;top:0;z-index:5;}
  .top img{height:34px;width:auto;}
  .top h1{font-size:1.05rem;flex:1;}
  .stripe{height:4px;background:linear-gradient(90deg,var(--b-blue) 0 25%,var(--b-green) 25% 50%,var(--b-amber) 50% 75%,var(--b-red) 75%);}
  main{max-width:520px;margin:0 auto;padding:16px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(29,36,51,.06);}
  label{display:block;font-weight:700;margin:14px 0 6px;}
  input[type=text]{width:100%;padding:13px 14px;border:2px solid #c9c2b0;border-radius:12px;background:#fff;color:var(--ink);}
  input.code{text-align:center;letter-spacing:.3em;font-size:1.6rem;font-weight:800;text-transform:uppercase;direction:ltr;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;}
  .btn.pri{background:var(--ink);color:#fff;}
  .btn.block{width:100%;margin-top:18px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .err{margin-top:12px;color:var(--danger);font-weight:700;min-height:1.4em;}
  .muted{color:var(--muted);}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:.95rem;}
  .pill.team{background:var(--ink);color:#fff;border-color:var(--ink);}
  .note{padding:12px 14px;border-radius:12px;background:#fff7e0;border:1px solid #ecd9a0;margin-bottom:12px;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .cellbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:8px 4px;border-radius:14px;border:0;color:#fff;font-weight:700;text-align:center;}
  .cellbtn svg{width:30px;height:30px;}
  .cellbtn .s{font-size:.8rem;font-weight:600;opacity:.95;}
  .t-electricity{background:var(--c-el);} .t-machines{background:var(--c-ma);} .t-biotech{background:var(--c-bi);}
  .cellbtn:disabled{background:#e9e4d6;color:#4d5663;}
  .cellbtn .by{font-size:.75rem;}
  .logo-cell{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:14px;min-height:96px;font-weight:800;color:var(--muted);}
  /* question */
  .ov{position:fixed;inset:0;background:rgba(29,36,51,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .ov.on{display:flex;}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));}
  .tag{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .tag span{padding:4px 12px;border-radius:999px;color:#fff;font-weight:700;font-size:.9rem;}
  .tag .b{background:var(--ink);}
  .tmr{display:flex;align-items:center;gap:10px;margin:6px 0 12px;}
  .tmr .num{font-family:'Rubik',sans-serif;font-weight:800;font-size:1.7rem;min-width:3ch;text-align:center;}
  .tmr .track{flex:1;height:10px;border-radius:99px;background:#ece6d6;overflow:hidden;}
  .tmr .fill{height:100%;width:100%;background:var(--b-green);transform-origin:right;transition:transform .25s linear;}
  .tmr.low .fill{background:var(--danger);} .tmr.low .num{color:var(--danger);}
  .q{font-size:1.2rem;font-weight:700;margin:6px 0 14px;}
  .reward{background:#fff1c9;border:1px solid #ecd078;border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:10px;}
  .opt{display:flex;gap:10px;align-items:center;width:100%;text-align:start;margin-top:8px;padding:12px;border-radius:12px;border:2px solid #c9c2b0;background:#fff;color:var(--ink);font-weight:600;min-height:52px;}
  .opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;}
  .opt.sel{border-color:var(--b-blue);background:#e8f3fb;}
  .hint{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:#eef6e3;border:1px solid #c5dca0;font-weight:600;}
  .hint.on{display:block;}
  .sent{margin-top:12px;font-weight:700;color:var(--c-bi);}
  .timesup{display:none;margin-top:12px;font-weight:800;color:var(--danger);}
  .timesup.on{display:block;}
  .foot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .foot .btn{flex:1;}
  .conn{position:fixed;bottom:10px;inset-inline:10px;margin:auto;max-width:360px;background:var(--danger);color:#fff;padding:8px 14px;border-radius:12px;text-align:center;font-weight:700;display:none;z-index:30;}
  .conn.on{display:block;}
  @media (prefers-reduced-motion:reduce){ .tmr .fill{transition:none;} }
</style>
</head>
<body>
<div class="top">
  <img src="ashdod-logo.png" alt="" onerror="this.remove()">
  <h1>כוורת הידע</h1>
  <span class="pill" id="who" hidden></span>
</div>
<div class="stripe"></div>

<main>
  <!-- הצטרפות -->
  <section class="panel" id="joinView">
    <h2>הצטרפות למשחק</h2>
    <p class="muted" style="margin:6px 0 0">הקוד מופיע על המסך הגדול.</p>
    <form id="joinForm" autocomplete="off" novalidate>
      <label for="code">קוד החדר</label>
      <input type="text" class="code" id="code" maxlength="5" inputmode="latin" autocapitalize="characters" spellcheck="false" aria-describedby="err">
      <label for="name">שם פרטי או כינוי</label>
      <input type="text" id="name" maxlength="20" autocomplete="given-name" aria-describedby="err">
      <p class="muted" style="margin:6px 0 0;font-size:.9rem">נא לא להזין שם משפחה או פרטים אישיים. הנתונים נמחקים אוטומטית אחרי 24 שעות.</p>
      <div class="err" id="err" role="alert"></div>
      <button class="btn pri block" id="joinBtn" type="submit">כניסה למשחק</button>
    </form>
  </section>

  <!-- משחק -->
  <section id="gameView" hidden>
    <div class="bar">
      <span class="pill team" id="teamPill" hidden></span>
      <span class="pill" id="onlinePill"></span>
      <button class="btn" id="leaveBtn" style="margin-inline-start:auto;min-height:40px;padding:4px 12px">יציאה</button>
    </div>
    <div class="note" id="status" role="status" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<!-- שאלה -->
<div class="ov" id="qov">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="qtext" tabindex="-1">
    <div class="tag"><span id="mTrack"></span><span class="b" id="mType"></span></div>
    <div class="tmr" id="tmr"><span class="num" id="num" aria-hidden="true"></span><div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div></div>
    <div class="reward" id="reward" hidden>🎁 שאלת הפתעה — פרס מחכה למי שפותר!</div>
    <p class="q" id="qtext"></p>
    <div id="answerBox"></div>
    <div class="hint" id="hint"></div>
    <div class="timesup" id="timesup" role="status">⏰ הזמן נגמר!</div>
    <div class="sent" id="sent" role="status"></div>
    <div class="foot">
      <button class="btn" id="hintBtn" type="button">💡 רמז</button>
      <button class="btn pri" id="closeQ" type="button">סיימנו</button>
    </div>
  </div>
</div>
<div class="conn" id="conn" role="status">אין חיבור לשרת… מנסים שוב</div>

<script src="hive-data.js"></script>
<script type="module">
import * as L from './hive-live.js';

const $ = id => document.getElementById(id);
const KEY = 'hive.player';
const sget = k => { try{ return sessionStorage.getItem(k); }catch(e){ return null; } };
const sset = (k,v) => { try{ sessionStorage.setItem(k,v); }catch(e){} };
const lget = () => { try{ return JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){ return null; } };
const lset = v => { try{ v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); }catch(e){} };

const ICON = {
  knowledge:'<circle cx="12" cy="10" r="6"/><path d="M9.5 16h5"/><path d="M10 19h4"/><path d="M12 4V2"/>',
  logic:'<circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h5"/><path d="M12 12l5-5"/><path d="M12 12l5 5"/>',
  task:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8"/><path d="M8 12l2 2 4-4"/><path d="M8 17h5"/>',
  surprise:'<rect x="3" y="9" width="18" height="11" rx="1"/><path d="M3 13h18"/><path d="M12 9v11"/><path d="M12 9c-2-4-7-4-7-1 0 2 3 1 7 1Z"/><path d="M12 9c2-4 7-4 7-1 0 2-3 1-7 1Z"/>'
};
const svg = t => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[t]}</svg>`;

let me = lget();            // {code, id, name}
let S = null;               // מצב אחרון מהשרת
let unwatch = null, busy = false, offline = 0;
let q = { cell:null, end:0, total:0, handle:null, sent:false, done:false };

/* ---------- הצטרפות ---------- */
const params = new URLSearchParams(location.search);
$('code').value = (params.get('room') || '').toUpperCase().slice(0,5);
if(me && me.code) $('code').value = me.code;
if(me && me.name) $('name').value = me.name;

$('joinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('code').value.trim().toUpperCase(), name = $('name').value.trim();
  $('err').textContent = '';
  if(code.length < 4){ $('err').textContent = 'נא להזין את קוד החדר מהמסך'; $('code').focus(); return; }
  if(!name){ $('err').textContent = 'נא להזין שם פרטי או כינוי'; $('name').focus(); return; }
  if(!L.isConfigured){ $('err').textContent = 'השרת עדיין לא הוגדר'; return; }
  $('joinBtn').disabled = true;
  try{
    const id = await L.join(code, name);
    me = { code, id, name }; lset(me);
    await enterGame();
  }catch(err){ $('err').textContent = L.hebError(err); }
  finally{ $('joinBtn').disabled = false; }
});
$('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });

$('leaveBtn').addEventListener('click', () => { if(confirm('לצאת מהמשחק?')) leave(''); });

function leave(msg){
  if(unwatch){ unwatch(); unwatch = null; }
  stopQ(); $('qov').classList.remove('on');
  lset(null); me = null; S = null;
  $('gameView').hidden = true; $('joinView').hidden = false; $('who').hidden = true;
  $('err').textContent = msg || ''; $('name').focus();
}

async function enterGame(){
  $('joinView').hidden = true; $('gameView').hidden = false;
  $('who').hidden = false; $('who').textContent = me.name;
  await refresh();
  if(!S || !S.exists) return;
  if(unwatch) unwatch();
  unwatch = await L.watchRoom(me.code, refresh, 8000);
  $('status').focus && 0;
}

/* ---------- מצב ---------- */
async function refresh(){
  if(!me || busy) return;
  busy = true;
  try{
    const s = await L.state(me.id);
    offline = 0; $('conn').classList.remove('on');
    if(!s || !s.exists){ leave('החיבור נותק. אפשר להצטרף מחדש'); return; }
    S = s; render();
  }catch(e){
    if(++offline >= 2) $('conn').classList.add('on');
  }finally{ busy = false; }
}

function openedMap(){ const m = {}; (S.opened || []).forEach(o => { m[o.cell_id] = o; }); return m; }

function render(){
  const room = S.room || {}, opened = openedMap();
  const tp = $('teamPill');
  if(room.groups_n > 0 && S.team){ tp.hidden = false; tp.textContent = 'קבוצה ' + S.team; } else tp.hidden = true;
  $('onlinePill').textContent = 'מחוברים: ' + S.online;
  let msg = '';
  if(room.closed) msg = 'המשחק הסתיים. תודה שהשתתפתם!';
  else if(room.groups_n > 0 && !S.team) msg = 'ממתינים שהמנחה ישייך אתכם לקבוצה…';
  else if(room.open_mode === 'admin') msg = 'המנחה פותח את התאים. הסתכלו על המסך הגדול.';
  else msg = 'בחרו תא כדי לפתוח אותו. כל תא נפתח פעם אחת בלבד.';
  $('status').textContent = msg;

  const canOpen = !room.closed && room.open_mode === 'teams' && !(room.groups_n > 0 && !S.team);
  const g = $('grid'); g.textContent = '';
  CELLS.forEach((c, i) => {
    if(c.logo) return;
    const id = cellId(i), o = opened[id];
    const b = document.createElement('button'); b.type = 'button';
    const label = TRACKS[c.track].short + ' — ' + TYPES[c.type].name;
    if(o){
      b.className = 'cellbtn'; b.disabled = true;
      b.innerHTML = '<span>✓</span><span class="s">' + TRACKS[c.track].short + '</span>' + (room.groups_n > 0 && o.team ? '<span class="by">קבוצה ' + o.team + '</span>' : '');
      b.setAttribute('aria-label', label + ' (נפתח' + (o.team ? ' על ידי קבוצה ' + o.team : '') + ')');
    } else {
      b.className = 'cellbtn t-' + c.track; b.disabled = !canOpen;
      b.innerHTML = svg(c.type) + '<span>' + TRACKS[c.track].short + '</span><span class="s">' + TYPES[c.type].name + '</span>';
      b.setAttribute('aria-label', label);
      b.addEventListener('click', () => pick(i, b));
    }
    g.appendChild(b);
  });
  syncQuestion(opened);
}

async function pick(i, btn){
  btn.disabled = true;
  try{
    const ok = await L.openCell(me.id, cellId(i));
    if(!ok) $('status').textContent = 'התא כבר נפתח על ידי מישהו אחר';
  }catch(e){ $('status').textContent = L.hebError(e); }
  busy = false; await refresh();
}

/* ---------- שאלה: מוצגת לקבוצה שפתחה את התא ---------- */
function dismissed(){ try{ return JSON.parse(sget('hive.dis.' + me.code) || '[]'); }catch(e){ return []; } }
function syncQuestion(opened){
  if(q.cell) return;                              // שאלה פעילה כבר מוצגת
  const dis = dismissed();
  const mine = (S.opened || []).filter(o => o.team === S.team && !dis.includes(o.cell_id + '@' + o.opened_at));
  if(!mine.length) return;
  const o = mine[mine.length - 1];
  showQuestion(o.cell_id, o.cell_id + '@' + o.opened_at);
}

function showQuestion(id, key){
  const i = +id.slice(1), c = CELLS[i]; if(!c || c.logo) return;
  q = { cell:id, key, total:TYPES[c.type].seconds, end:0, handle:null, sent:false, done:false };
  const t0k = 'hive.t0.' + me.code + '.' + key;
  let t0 = +sget(t0k); if(!t0){ t0 = Date.now(); sset(t0k, t0); }
  q.end = t0 + q.total * 1000;
  $('mTrack').textContent = TRACKS[c.track].name;
  $('mTrack').style.background = { electricity:'var(--c-el)', machines:'var(--c-ma)', biotech:'var(--c-bi)' }[c.track];
  $('mType').textContent = TYPES[c.type].name;
  $('qtext').textContent = c.q;
  $('reward').hidden = !c.reward;
  $('hint').classList.remove('on'); $('hint').textContent = c.hint ? '💡 רמז: ' + c.hint : '';
  $('hintBtn').style.display = c.hint ? '' : 'none';
  $('timesup').classList.remove('on'); $('sent').textContent = '';
  const box = $('answerBox'); box.textContent = '';
  if(c.options){
    c.options.forEach((t, k) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
      b.innerHTML = '<span class="l"></span><span></span>';
      b.firstChild.textContent = 'אבגד'[k]; b.lastChild.textContent = t;
      b.addEventListener('click', () => send(b, t));
      box.appendChild(b);
    });
  } else if(c.type !== 'task'){
    const lab = document.createElement('label'); lab.htmlFor = 'free'; lab.textContent = 'התשובה שלכם';
    const inp = document.createElement('input'); inp.type = 'text'; inp.id = 'free'; inp.maxLength = 200; inp.autocomplete = 'off';
    const go = document.createElement('button'); go.type = 'button'; go.className = 'btn pri block'; go.textContent = 'שליחה';
    go.addEventListener('click', () => { if(inp.value.trim()) send(go, inp.value.trim()); });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); go.click(); } });
    box.append(lab, inp, go);
  }
  $('qov').classList.add('on'); $('sheet').focus({preventScroll:true});
  tickQ(); q.handle = setInterval(tickQ, 250);
}

function tickQ(){
  const ms = Math.max(0, q.end - Date.now());
  $('num').textContent = Math.ceil(ms/1000);
  $('fill').style.transform = 'scaleX(' + (ms / (q.total*1000)).toFixed(3) + ')';
  $('tmr').classList.toggle('low', ms > 0 && ms <= 5000);
  if(ms <= 0 && !q.done){ q.done = true; $('timesup').classList.add('on'); try{ navigator.vibrate && navigator.vibrate(200); }catch(e){} }
}
function stopQ(){ if(q.handle){ clearInterval(q.handle); q.handle = null; } q.cell = null; }

async function send(btn, text){
  if(q.sent) return; q.sent = true;
  [...$('answerBox').querySelectorAll('button,input')].forEach(x => x.disabled = true);
  btn.classList.add('sel');
  try{
    await L.submitAnswer(me.id, q.cell, text);
    $('sent').textContent = '✓ התשובה נשלחה. עכשיו עונים גם בעל פה למנחה.';
  }catch(e){
    q.sent = false; [...$('answerBox').querySelectorAll('button,input')].forEach(x => x.disabled = false);
    $('sent').textContent = L.hebError(e);
  }
}
$('hintBtn').addEventListener('click', () => $('hint').classList.toggle('on'));
$('closeQ').addEventListener('click', () => {
  const dis = dismissed(); if(q.key && !dis.includes(q.key)) dis.push(q.key); sset('hive.dis.' + me.code, JSON.stringify(dis));
  stopQ(); $('qov').classList.remove('on'); render();
});

/* ---------- התחלה ---------- */
if(me && me.id) enterGame(); else $('code').value ? $('name').focus() : $('code').focus();
</script>
</body>
</html>
