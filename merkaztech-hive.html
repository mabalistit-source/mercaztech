<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>כוורת הידע — המרכז הטכנולוגי אשדוד</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap');

  :root{
    --bg:#fbf8f1; --ink:#1d2433; --muted:#556070; --line:#e6dfcf; --card:#ffffff;
    --c-el:#a35f00;  --c-el2:#8a5000;
    --c-ma:#1f6fb0;  --c-ma2:#16599a;
    --c-bi:#467d18;  --c-bi2:#386a12;
    --b-blue:#3090d8; --b-green:#78a830; --b-amber:#f0a818; --b-red:#d84830;
    --danger:#b3261e;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
    background:
      radial-gradient(circle at 15% 0%, #fff7e0 0, transparent 45%),
      radial-gradient(circle at 90% 100%, #e8f3fb 0, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Assistant','Segoe UI','Arial',sans-serif;
  }
  button{font-family:inherit; cursor:pointer;}
  h1,h2,h3{font-family:'Rubik','Assistant',sans-serif; margin:0;}

  /* ---------- header ---------- */
  .top{
    position:relative; flex:none; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:8px clamp(12px,2vw,28px); background:#fff; min-height:64px;
    box-shadow:0 2px 10px rgba(29,36,51,.06);
  }
  .top::after{
    content:""; position:absolute; inset-inline:0; bottom:0; height:4px;
    background:linear-gradient(90deg,var(--b-blue) 0 25%,var(--b-green) 25% 50%,var(--b-amber) 50% 75%,var(--b-red) 75% 100%);
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand img{height:46px; width:auto; flex:none;}
  .brand .t1{font:800 clamp(1.15rem,2.2vw,1.9rem)/1.1 'Rubik',sans-serif;}
  .brand .t2{font-size:clamp(.8rem,1.3vw,1.05rem); color:var(--muted); font-weight:600;}
  .tools{display:flex; gap:8px; flex:none;}
  .ibtn{
    min-width:44px; min-height:44px; padding:0 14px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink); font-weight:700; font-size:.95rem;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .ibtn:hover{border-color:var(--ink);}
  .ibtn.arm{background:var(--danger); color:#fff; border-color:var(--danger);}

  /* ---------- hive ---------- */
  main{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 12px; overflow:auto;}
  .hive{--hw:150px; --hh:calc(var(--hw)*1.1547); --gap:6px; display:flex; flex-direction:column; align-items:center;}
  .row{display:flex; justify-content:center;}
  .row + .row{margin-top:calc(var(--hh)*-0.25 + var(--gap)*0.86);}
  .hexbtn{
    position:relative; flex:none; width:var(--hw); height:var(--hh); margin:0 calc(var(--gap)/2);
    padding:0; border:0; background:none; color:#fff;
    filter:drop-shadow(0 6px 8px rgba(29,36,51,.2));
    transition:transform .16s ease, filter .16s ease;
    animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both; animation-delay:calc(var(--i)*45ms);
  }
  .hex{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  }
  .t-electricity .hex{background:linear-gradient(160deg,var(--c-el),var(--c-el2));}
  .t-machines    .hex{background:linear-gradient(160deg,var(--c-ma),var(--c-ma2));}
  .t-biotech     .hex{background:linear-gradient(160deg,var(--c-bi),var(--c-bi2));}
  .hexbtn:not(:disabled):hover{transform:translateY(-5px) scale(1.05); z-index:2; filter:drop-shadow(0 12px 12px rgba(29,36,51,.28));}
  .hexbtn:focus-visible{outline:4px solid var(--ink); outline-offset:3px; border-radius:14px; z-index:3;}
  .in{display:flex; flex-direction:column; align-items:center; gap:calc(var(--hw)*.02); text-align:center; padding:0 6%;}
  .ticon{width:calc(var(--hw)*.22); height:calc(var(--hw)*.22); display:block;}
  .ticon svg{width:100%; height:100%; display:block;}
  .tname{font:800 max(14px,calc(var(--hw)*.125))/1.1 'Rubik','Assistant',sans-serif;}
  .ttype{font:600 max(12px,calc(var(--hw)*.092))/1.15 'Assistant',sans-serif; color:rgba(255,255,255,.94);}
  .hexbtn:disabled{cursor:default; filter:none;}
  .hexbtn:disabled .hex{background:#dcd6c8;}
  .hexbtn:disabled .in{color:#8b8575;}
  .hexbtn:disabled .check{width:calc(var(--hw)*.32); height:calc(var(--hw)*.32);}
  .logohex{position:relative; flex:none; width:var(--hw); height:var(--hh); margin:0 calc(var(--gap)/2);
    filter:drop-shadow(0 6px 8px rgba(29,36,51,.2)); animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;}
  .logohex .hex{background:linear-gradient(135deg,var(--b-blue),var(--b-green),var(--b-amber),var(--b-red));}
  .logohex .hex::after{
    content:""; position:absolute; inset:calc(var(--hw)*.045); background:#fff;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  }
  .logohex img{position:relative; z-index:1; height:50%; width:auto;}
  @keyframes pop{from{opacity:0; transform:scale(.55);} to{opacity:1; transform:scale(1);}}

  /* ---------- overlays ---------- */
  .ov{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:2vh 2vw; background:rgba(20,26,38,.74);}
  .ov.on{display:flex;}
  .card{
    --tc:var(--c-ma); width:min(1100px,96vw); max-height:96vh; max-height:96dvh;
    display:flex; flex-direction:column; overflow:hidden; background:var(--card); border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,.4); animation:cardIn .24s ease-out both;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:none;}}
  .card:focus{outline:none;}
  .card.t-electricity{--tc:var(--c-el);}
  .card.t-machines{--tc:var(--c-ma);}
  .card.t-biotech{--tc:var(--c-bi);}
  .card-head{
    flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:12px 20px; color:#fff;
    background:var(--tc);
  }
  .card.t-electricity .card-head{background:linear-gradient(160deg,var(--c-el),var(--c-el2));}
  .card.t-machines .card-head{background:linear-gradient(160deg,var(--c-ma),var(--c-ma2));}
  .card.t-biotech .card-head{background:linear-gradient(160deg,var(--c-bi),var(--c-bi2));}
  .tag{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .tag .a{font:800 clamp(1.05rem,1.8vw,1.6rem)/1.15 'Rubik',sans-serif;}
  .tag .b{font-size:clamp(.9rem,1.4vw,1.2rem); opacity:.95; font-weight:600;}
  .timer{position:relative; width:clamp(64px,8vw,92px); height:clamp(64px,8vw,92px);}
  .timer svg{width:100%; height:100%; transform:rotate(-90deg);}
  .timer .bg{stroke:rgba(255,255,255,.3);} .timer .fg{stroke:#fff; transition:stroke-dashoffset .25s linear;}
  .timer .num{position:absolute; inset:0; display:grid; place-items:center; font:800 clamp(1.3rem,2.4vw,2rem) 'Rubik',sans-serif;}
  .timer.low .fg{stroke:#ffd5cc;} .timer.low{animation:pulse .8s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.08);}}
  .xbtn{justify-self:end; width:48px; height:48px; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:transparent; color:#fff; font-size:1.4rem; line-height:1;}
  .xbtn:hover{background:rgba(255,255,255,.2);}
  .card-body{flex:1; min-height:0; overflow:auto; padding:clamp(16px,3vh,32px) clamp(18px,3vw,44px); font-size:calc(1rem*var(--fit,1));}
  .reward{display:none; margin:0 0 14px; padding:.55em 1em; border-radius:12px; background:#fff3d6; border:2px solid var(--b-amber); font-weight:700; font-size:calc(clamp(1rem,1.5vw,1.4rem)*var(--fit,1));}
  .reward.on{display:block;}
  .q{font:700 calc(clamp(1.35rem,2.7vw,2.7rem)*var(--fit,1))/1.5 'Assistant',sans-serif; margin:0 0 .7em;}
  .opts{display:flex; flex-direction:column; gap:calc(.5em*var(--fit,1));}
  .opt{display:flex; gap:.7em; align-items:flex-start; padding:.55em .9em; border:2px solid var(--line); border-radius:14px; background:#fffdf8;
       font-size:calc(clamp(1.05rem,1.75vw,1.85rem)*var(--fit,1)); line-height:1.45;}
  .opt .l{flex:none; width:1.9em; height:1.9em; border-radius:50%; background:var(--tc); color:#fff; display:grid; place-items:center; font-weight:800; font-size:.85em;}
  .hint{display:none; margin-top:1em; padding:.6em 1em; border-radius:12px; background:#eef6ff; border:2px solid #bcd9f5; font-size:calc(clamp(1.05rem,1.6vw,1.6rem)*var(--fit,1)); font-weight:600;}
  .hint.on{display:block;}
  .timesup{display:none; margin-top:1em; padding:.6em 1em; border-radius:12px; background:#fdeceb; border:2px solid var(--danger); color:var(--danger); font-weight:800; text-align:center; font-size:calc(clamp(1.1rem,1.8vw,1.8rem)*var(--fit,1));}
  .timesup.on{display:block;}
  .card-foot{flex:none; display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px 20px; border-top:1px solid var(--line); background:#faf7ef;}
  .btn{min-height:50px; padding:0 22px; border-radius:12px; border:2px solid var(--ink); background:#fff; color:var(--ink); font-weight:800; font-size:1.05rem;}
  .btn:hover{background:#f1ede2;}
  .btn.pri{background:var(--ink); color:#fff; margin-inline-start:auto;}
  .btn.pri:hover{background:#2c3650;}

  /* splash + celebration */
  .panel{width:min(760px,94vw); max-height:96vh; max-height:96dvh; overflow:auto; background:#fff; border-radius:26px; padding:clamp(22px,4vh,44px) clamp(20px,4vw,52px); text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.35); animation:cardIn .3s ease-out both;}
  .panel img.logo{height:clamp(72px,14vh,120px); width:auto; margin-bottom:10px;}
  .panel h2{font-size:clamp(1.6rem,3.6vw,2.6rem); line-height:1.2; margin-bottom:.35em; text-wrap:balance;}
  .panel p.sub{font-size:clamp(1.05rem,1.8vw,1.4rem); color:var(--muted); margin:0 0 1.1em; font-weight:600;}
  .steps{list-style:none; padding:0; margin:0 0 1.4em; display:flex; flex-direction:column; gap:10px; text-align:start;}
  .steps li{display:flex; gap:14px; align-items:center; padding:.6em 1em; border-radius:14px; background:#faf7ef; font-size:clamp(1.05rem,1.8vw,1.4rem); font-weight:700;}
  .steps .n{flex:none; width:2em; height:2em; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:800; font-size:.9em;}
  .panel .btn.pri{margin:0; min-height:58px; padding:0 40px; font-size:1.3rem;}
  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:60;}
  .confetti i{position:absolute; top:-5vh; width:10px; height:16px; border-radius:2px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg);}}

  @media (max-width:640px){
    .brand img{height:36px;} .brand .t2{display:none;}
    .ov{padding:0;} .card{width:100vw; max-height:100vh; max-height:100dvh; border-radius:0;}
    .card-head{padding:10px 14px;} .card-foot{padding:10px 14px;}
    .btn{flex:1 1 40%; padding:0 12px;} .btn.pri{flex:1 1 100%; margin:0;}
    .ibtn .lbl{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="ashdod-logo.png" alt="עיריית אשדוד" onerror="this.style.display='none'">
    <div>
      <div class="t1">כוורת הידע</div>
      <div class="t2">המרכז הטכנולוגי אשדוד</div>
    </div>
  </div>
  <div class="tools">
    <button class="ibtn" id="soundBtn" aria-pressed="true" aria-label="צליל פעיל. לחיצה להשתקה">🔊<span class="lbl"> צליל</span></button>
    <button class="ibtn" id="resetBtn" aria-label="איפוס הכוורת" title="איפוס הכוורת">↺<span class="lbl"> איפוס הכוורת</span></button>
  </div>
</header>

<main id="main"><div class="hive" id="hive" role="group" aria-label="כוורת השאלות"></div></main>

<!-- welcome -->
<div class="ov on" id="splash" role="dialog" aria-modal="true" aria-labelledby="wTitle">
  <div class="panel">
    <img class="logo" src="ashdod-logo.png" alt="עיריית אשדוד" onerror="this.style.display='none'">
    <h2 id="wTitle"></h2>
    <p class="sub" id="wSub"></p>
    <ol class="steps" id="wSteps"></ol>
    <button class="btn pri" id="startBtn"></button>
  </div>
</div>

<!-- question -->
<div class="ov" id="qov">
  <div class="card" id="card" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="qtext">
    <div class="card-head">
      <div class="tag"><span class="a" id="mTrack"></span><span class="b" id="mType"></span></div>
      <div class="timer" id="timer" aria-hidden="true">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44" fill="none" stroke-width="9"/><circle class="fg" id="ring" cx="50" cy="50" r="44" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
        <span class="num" id="num"></span>
      </div>
      <button class="xbtn" id="xBtn" aria-label="סגירת השאלה">✕</button>
    </div>
    <div class="card-body" id="body">
      <div class="reward" id="reward">🎁 שאלת הפתעה — פרס מחכה למי שפותר!</div>
      <p class="q" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="hint" id="hint"></div>
      <div class="timesup" id="timesup" role="status">⏰ הזמן נגמר!</div>
    </div>
    <div class="card-foot">
      <button class="btn" id="pauseBtn">עצירת טיימר</button>
      <button class="btn" id="hintBtn">💡 רמז</button>
      <button class="btn pri" id="doneBtn">סיום השאלה ✓</button>
    </div>
  </div>
</div>

<!-- celebration -->
<div class="ov" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="panel">
    <h2 id="winTitle">🎉 כל הכבוד!</h2>
    <p class="sub">פתחתם את כל תאי הכוורת.</p>
    <button class="btn pri" id="againBtn">משחק חדש</button>
  </div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
/* ===== ניסוח הודעת הברכה — אפשר לערוך כאן ===== */
const WELCOME = {
  title: 'ברוכים הבאים למרכז הטכנולוגי אשדוד',
  sub:   'כוורת הידע — שלוש מגמות ו-12 אתגרים',
  steps: ['בוחרים תא בכוורת', 'עונים בעל פה לפני שהזמן נגמר', 'כל תא נפתח פעם אחת בלבד'],
  button:'בואו נתחיל'
};

/* ===== נתונים ===== */
const TRACKS = {
  electricity:{ name:'הנדסת חשמל ואלקטרוניקה', short:'חשמל' },
  machines:   { name:'הנדסת מכונות',            short:'מכונות' },
  biotech:    { name:'ביוטכנולוגיה',             short:'ביוטק' }
};
const TYPES = {
  knowledge:{ name:'שאלת ידע',    seconds:20 },
  logic:    { name:'שאלת היגיון', seconds:25 },
  task:     { name:'שאלת משימה', seconds:90 },
  surprise: { name:'שאלת הפתעה', seconds:30 }
};
const CELLS = [
 {
  "logo": true
 },
 {
  "track": "electricity",
  "type": "knowledge",
  "q": "למה ציפור שעומדת על חוט חשמל לא מתחשמלת?",
  "hint": "ציפור על חוט"
 },
 {
  "track": "machines",
  "type": "knowledge",
  "q": "במערכת מכטרונית, מהו התפקיד העיקרי של הבקר?",
  "options": [
   "להפוך אנרגיה חשמלית לאנרגיה מכנית",
   "לקבל מידע מחיישנים, לעבד אותו ולקבוע את פעולת המערכת",
   "להגדיל את המתח שמגיע למנוע",
   "לחבר את החלקים המכניים של המערכת"
  ],
  "hint": "שבב אלקטרוני"
 },
 {
  "track": "biotech",
  "type": "knowledge",
  "q": "במעבדה נמצאו שתי קבוצות תאים זהות כמעט לחלוטין. בקבוצה א' נמדדה כמות גבוהה של חלבון מסוים, ובקבוצה ב' כמעט לא נמצא החלבון. בבדיקת רצף ה-DNA נמצא שבקבוצה ב' קיימת מוטציה באזור הפרומוטר של הגן. איזה הסבר הוא הסביר ביותר?",
  "options": [
   "המוטציה גרמה לריבוזומים לייצר יותר חלבון",
   "המוטציה עשויה לפגוע בקישור של RNA פולימראז ובכך להפחית את השעתוק",
   "המוטציה גרמה ל-DNA להפוך ל-RNA",
   "המוטציה פגעה ישירות בכל הריבוזומים בתא"
  ],
  "hint": "סליל DNA עם דגל בהתחלה"
 },
 {
  "track": "electricity",
  "type": "logic",
  "q": "אם המקרר מקרר, למה החלק האחורי שלו חם?",
  "hint": "שמש יוצאת מתוך המקרר"
 },
 {
  "track": "machines",
  "type": "logic",
  "q": "רובוט נוסע בקו ישר באמצעות שני מנועים. המנוע הימני מסתובב מעט מהר יותר מהמנוע השמאלי. מה צפוי לקרות לרובוט, ומדוע?",
  "options": [
   "הרובוט ימשיך ישר כי שני המנועים פועלים",
   "הרובוט יסטה לכיוון הצד של המנוע האיטי יותר",
   "הרובוט יסטה לכיוון הצד של המנוע המהיר יותר",
   "הרובוט יעצור מיד"
  ],
  "hint": "רובוט שפונה הצידה"
 },
 {
  "track": "biotech",
  "type": "logic",
  "q": "חוקר חשף תאים לקרינת UV, ולאחר מכן חילק אותם לשתי קבוצות: קבוצה א' הושארה בחושך, קבוצה ב' נחשפה לאור כחול לזמן מה. לאחר מכן נבדקה כמות הנזק ב-DNA. איזו תוצאה היא הסבירה ביותר, ומדוע?",
  "options": [
   "בשתי הקבוצות כמות הנזק תהיה זהה, מכיוון שקרינת UV פוגעת ב-DNA באופן בלתי הפיך",
   "בקבוצה א' צפויה להישאר כמות גדולה יותר של נזק, ואילו בקבוצה ב' כמות הנזק עשויה להיות נמוכה יותר, משום שאנזימים מסוימים יכולים להשתמש באנרגיית אור כחול לתיקון נזקי DNA",
   "בקבוצה ב' כמות הנזק תהיה גבוהה יותר, משום שאור כחול גורם בעצמו לשבירת קשרים ב-DNA",
   "בשתי הקבוצות לא יימצא נזק, משום שהתאים תמיד מתקנים DNA שנפגע מקרינת UV באופן מיידי"
  ],
  "hint": "קרן אור כחולה"
 },
 {
  "track": "electricity",
  "type": "task",
  "q": "קיר עם מעגל חשמלי פתוח: חוטים, סוללה ונורה. איך אפשר להדליק את האור? מצאו את שתי הנקודות הנכונות ו\"סִגרו\" את המעגל."
 },
 {
  "track": "machines",
  "type": "task",
  "q": "בנו מנגנון גלגלי שיניים (בעזרת ערכת הרכבה כגון לגו טכניק או מאייקנו) שממחיש כיצד שינוי היחס בין גדלי הגלגלים משנה את מהירות הסיבוב ואת המומנט המועבר. הדגימו לפחות שני יחסי הילוכים שונים והסבירו מה קורה למהירות ולכוח בכל יחס."
 },
 {
  "track": "biotech",
  "type": "task",
  "q": "בנו דגם של גדילי ה-DNA. הדגם חייב להציג: שני גדילים, ארבעה סוגי בסיסים, התאמה בין הבסיסים, מבנה של סליל כפול, וסימון סוג הקשר."
 },
 {
  "track": "electricity",
  "type": "surprise",
  "q": "מה ההבדל בין זרם למתח?",
  "hint": "נהר זורם",
  "reward": true
 },
 {
  "track": "machines",
  "type": "surprise",
  "q": "מערכת הילוכים מורכבת משני גלגלי שיניים: גלגל מניע בעל 60 שיניים המסתובב במהירות 120 סל\"ד, מחובר לגלגל מונע בעל 20 שיניים. מהי מהירות הסיבוב של הגלגל המונע, ומהו יחס ההילוכים?",
  "hint": "גלגל שיניים קטן",
  "reward": true
 },
 {
  "track": "biotech",
  "type": "surprise",
  "q": "חוקר השווה בין תאים תקינים לתאים סרטניים, ומצא שבתאים הסרטניים גן מסוים — שתפקידו לעצור חלוקת תאים כאשר ה-DNA פגום — אינו פעיל. איזו תוצאה צפויה?",
  "options": [
   "התאים הסרטניים יפסיקו להתחלק לחלוטין",
   "התאים יוכלו להמשיך להתחלק גם כאשר קיימים נזקי DNA, ולכן עלולה לעלות הצטברות המוטציות",
   "התאים הסרטניים לא יכילו DNA",
   "כל התאים ימותו מיד לאחר הפגיעה ב-DNA"
  ],
  "hint": "תא מתחלק עם תמרור \"עצור\"",
  "reward": true
 }
];

/* ===== כלים ===== */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function icon(type){
  const p = {
    knowledge:'<circle cx="12" cy="10" r="6"/><path d="M9.5 16h5"/><path d="M10 19h4"/><path d="M12 4V2"/>',
    logic:'<circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h5"/><path d="M12 12l5-5"/><path d="M12 12l5 5"/>',
    task:'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8 8h8"/><path d="M8 12l2 2 4-4"/><path d="M8 17h5"/>',
    surprise:'<rect x="3" y="9" width="18" height="11" rx="1"/><path d="M3 13h18"/><path d="M12 9v11"/><path d="M12 9c-2-4-7-4-7-1 0 2 3 1 7 1Z"/><path d="M12 9c2-4 7-4 7-1 0 2-3 1-7 1Z"/>'
  }[type];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ===== מצב ===== */
let cells = [];
let active = -1;
let lastRows = '';
let sound = true;
let ac = null;

function newGame(){
  cells = CELLS.map(c => ({...c, answered:false}));
  lastRows = '';
  layoutHive(true);
}

/* ===== כוורת ===== */
function layoutHive(force){
  const narrow = innerWidth < 700 && innerHeight >= innerWidth;
  const rows = narrow ? [1,2,3,2,3,2] : [1,2,3,4,3];
  const main = $('main');
  const M = Math.max(...rows), R = rows.length;
  const availW = main.clientWidth - 24, availH = main.clientHeight - 24 - (R-1)*6*0.86;
  const factor = 1 + 0.75*(R-1);
  let W = Math.min(availH/(factor*1.1547), availW/(M+0.2));
  W = Math.max(72, Math.min(W, 270));
  $('hive').style.setProperty('--hw', W.toFixed(1)+'px');
  const key = rows.join(',');
  if(force || key !== lastRows){ lastRows = key; renderHive(rows); }
}

function renderHive(rows){
  const hive = $('hive'); hive.textContent = '';
  let idx = 0;
  rows.forEach(n => {
    const row = document.createElement('div'); row.className = 'row';
    for(let k=0;k<n;k++){ row.appendChild(makeCell(idx)); idx++; }
    hive.appendChild(row);
  });
}

function makeCell(i){
  const c = cells[i];
  if(c.logo){
    const d = document.createElement('div'); d.className = 'logohex'; d.style.setProperty('--i', i);
    d.innerHTML = '<div class="hex"><img src="ashdod-logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'b\'),{textContent:\'המרכז הטכנולוגי\'}))"></div>';
    return d;
  }
  const b = document.createElement('button'); b.type = 'button';
  b.className = 'hexbtn t-' + c.track; b.style.setProperty('--i', i);
  const label = TRACKS[c.track].short + ' — ' + TYPES[c.type].name;
  if(c.answered){
    b.disabled = true; b.setAttribute('aria-label', label + ' (נענה)');
    b.innerHTML = '<span class="hex"><span class="in">' + CHECK + '</span></span>';
  } else {
    b.setAttribute('aria-label', label);
    b.innerHTML = '<span class="hex"><span class="in"><span class="ticon">' + icon(c.type) + '</span>' +
      '<span class="tname">' + TRACKS[c.track].short + '</span><span class="ttype">' + TYPES[c.type].name + '</span></span></span>';
    b.addEventListener('click', () => openQuestion(i));
  }
  return b;
}

/* ===== שאלה ===== */
const CIRC = 276.46;
let T = { end:0, left:0, total:0, paused:false, handle:null, done:false };

function openQuestion(i){
  active = i; const c = cells[i];
  $('card').className = 'card t-' + c.track;
  $('mTrack').textContent = TRACKS[c.track].name;
  $('mType').textContent = TYPES[c.type].name;
  $('qtext').textContent = c.q;
  $('reward').classList.toggle('on', !!c.reward);
  const o = $('opts'); o.textContent = '';
  (c.options || []).forEach((t,k) => {
    const d = document.createElement('div'); d.className = 'opt';
    const l = document.createElement('span'); l.className = 'l'; l.textContent = 'אבגד'[k];
    const s = document.createElement('span'); s.textContent = t;
    d.append(l, s); o.appendChild(d);
  });
  $('hint').classList.remove('on');
  $('hint').textContent = c.hint ? '💡 רמז: ' + c.hint : '';
  $('hintBtn').style.display = c.hint ? '' : 'none';
  $('timesup').classList.remove('on');
  $('pauseBtn').textContent = 'עצירת טיימר';
  $('qov').classList.add('on');
  fitCard();
  startTimer(TYPES[c.type].seconds);
  $('card').focus({preventScroll:true});
}

function fitCard(){
  const card = $('card'), b = $('body'); let s = 1; card.style.setProperty('--fit', 1);
  for(let g=0; g<14 && b.scrollHeight > b.clientHeight + 1 && s > 0.6; g++){ s -= 0.05; card.style.setProperty('--fit', s.toFixed(2)); }
}

function closeQuestion(){
  stopTimer(); $('qov').classList.remove('on');
  if(active >= 0){ cells[active].answered = true; active = -1; }
  renderHive(lastRows.split(',').map(Number));
  const next = document.querySelector('.hexbtn:not(:disabled)');
  if(!next) celebrate(); else if(kbd) next.focus({preventScroll:true});
}

/* ===== טיימר ===== */
function startTimer(sec){
  stopTimer(); T = { end:Date.now()+sec*1000, left:sec*1000, total:sec, paused:false, handle:null, done:false };
  tick(); T.handle = setInterval(tick, 200);
}
function stopTimer(){ if(T.handle){ clearInterval(T.handle); T.handle = null; } }
function tick(){
  if(T.paused) return;
  const ms = Math.max(0, T.end - Date.now()), s = Math.ceil(ms/1000);
  $('num').textContent = s;
  $('ring').style.strokeDashoffset = (CIRC * (1 - ms/(T.total*1000))).toFixed(2);
  $('timer').classList.toggle('low', s <= 5 && s > 0);
  if(ms <= 0 && !T.done){ T.done = true; stopTimer(); $('timer').classList.remove('low'); $('timesup').classList.add('on'); fitCard(); beep(); }
}
$('pauseBtn').addEventListener('click', () => {
  if(T.done) return;
  if(!T.paused){ T.paused = true; T.left = Math.max(0, T.end - Date.now()); $('pauseBtn').textContent = 'המשך טיימר'; }
  else { T.paused = false; T.end = Date.now() + T.left; $('pauseBtn').textContent = 'עצירת טיימר'; }
});
$('hintBtn').addEventListener('click', () => { $('hint').classList.toggle('on'); fitCard(); });
$('doneBtn').addEventListener('click', closeQuestion);
$('xBtn').addEventListener('click', closeQuestion);

/* ===== צליל ===== */
function beep(){
  if(!sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    [[0,880],[.24,660]].forEach(([t,f]) => {
      const o = ac.createOscillator(), g = ac.createGain(), at = ac.currentTime + t;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.28, at+.02); g.gain.exponentialRampToValueAtTime(.0001, at+.22);
      o.connect(g).connect(ac.destination); o.start(at); o.stop(at+.24);
    });
  }catch(e){}
}
$('soundBtn').addEventListener('click', e => {
  sound = !sound; const b = e.currentTarget;
  b.setAttribute('aria-pressed', sound);
  b.setAttribute('aria-label', sound ? 'צליל פעיל. לחיצה להשתקה' : 'צליל מושתק. לחיצה להפעלה');
  b.firstChild.textContent = sound ? '🔊' : '🔇';
});

/* ===== איפוס (לחיצה כפולה) ===== */
let armTimer = null;
$('resetBtn').addEventListener('click', e => {
  const b = e.currentTarget, lbl = b.querySelector('.lbl');
  if(!b.classList.contains('arm')){
    b.classList.add('arm'); if(lbl) lbl.textContent = ' לחצו שוב לאישור';
    armTimer = setTimeout(disarm, 3500);
  } else { disarm(); newGame(); }
});
function disarm(){
  clearTimeout(armTimer); const b = $('resetBtn'); b.classList.remove('arm');
  const l = b.querySelector('.lbl'); if(l) l.textContent = ' איפוס הכוורת';
}

/* ===== חגיגה ===== */
function celebrate(){
  $('win').classList.add('on');
  const box = $('confetti'); box.textContent = '';
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cols = ['#3090d8','#78a830','#f0a818','#d84830','#1d2433'];
  for(let k=0;k<70;k++){
    const i = document.createElement('i');
    i.style.left = Math.random()*100 + 'vw'; i.style.background = cols[k % cols.length];
    i.style.animationDuration = (2.4 + Math.random()*2.2) + 's'; i.style.animationDelay = (Math.random()*1.2) + 's';
    box.appendChild(i);
  }
  setTimeout(() => { box.textContent = ''; }, 7000);
}
$('againBtn').addEventListener('click', () => { $('win').classList.remove('on'); $('confetti').textContent = ''; newGame(); });

/* ===== ברכה + מקלדת + גודל חלון ===== */
let kbd = false;
addEventListener('keydown', () => { kbd = true; }, true);
addEventListener('pointerdown', () => { kbd = false; }, true);
$('wTitle').textContent = WELCOME.title; $('wSub').textContent = WELCOME.sub; $('startBtn').textContent = WELCOME.button;
WELCOME.steps.forEach((t,k) => { const li = document.createElement('li'); li.innerHTML = '<span class="n">' + (k+1) + '</span>'; li.append(t); $('wSteps').appendChild(li); });
$('startBtn').addEventListener('click', () => {
  $('splash').classList.remove('on');
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if(ac.resume) ac.resume(); }catch(e){}
  if(kbd){ const f = document.querySelector('.hexbtn:not(:disabled)'); if(f) f.focus({preventScroll:true}); }
});
document.addEventListener('keydown', e => {
  const open = ['qov','splash','win'].map($).find(x => x.classList.contains('on'));
  if(e.key === 'Escape' && $('qov').classList.contains('on')){ closeQuestion(); return; }
  if(e.key === 'Tab' && open){
    const f = [...open.querySelectorAll('button:not([disabled])')].filter(x => x.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layoutHive(false); if($('qov').classList.contains('on')) fitCard(); }, 80); });

newGame();
$('startBtn').focus({preventScroll:true});
</script>
</body>
